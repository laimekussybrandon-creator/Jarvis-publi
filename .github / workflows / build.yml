name: Construir APK de Jarvis

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generar el proyecto Android
        run: |
          mkdir -p proj && cd proj
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Jarvis"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.jarvis.overlay"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.jarvis.overlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Jarvis"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:foregroundServiceType="microphone"
                      android:exported="false" />
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java
          cat > app/src/main/java/MainActivity.kt <<'EOF'
          package com.jarvis.overlay

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.text.InputType
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.Normalizer
          import java.util.Locale
          import kotlin.concurrent.thread
          import kotlin.math.abs

          private val BG = Color.parseColor("#050809")
          private val ACCENT = Color.parseColor("#00E0FF")
          private val WARN = Color.parseColor("#FFB454")
          private val TEXTC = Color.parseColor("#D9F2F7")
          private val SURFACE = Color.parseColor("#0E1B1F")
          private const val MODEL = "gemini-3.6-flash"

          private fun makeShape(fill: Int, stroke: Int, oval: Boolean, radius: Float = 0f): GradientDrawable {
              val g = GradientDrawable()
              g.shape = if (oval) GradientDrawable.OVAL else GradientDrawable.RECTANGLE
              g.setColor(fill)
              g.setStroke(3, stroke)
              if (!oval) g.cornerRadius = radius
              return g
          }

          private fun norm(s: String): String =
              Normalizer.normalize(s.lowercase(), Normalizer.Form.NFD)
                  .replace("\\p{M}".toRegex(), "")
                  .replace("[^a-z0-9 ]".toRegex(), "")
                  .trim()

          private fun openApp(ctx: Context, spoken: String): Boolean {
              val wanted = norm(spoken)
              if (wanted.isBlank()) return false
              val pm = ctx.packageManager
              val apps = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
              val hit = apps.firstOrNull { norm(it.loadLabel(pm).toString()) == wanted }
                  ?: apps.firstOrNull { norm(it.loadLabel(pm).toString()).contains(wanted) }
                  ?: apps.firstOrNull { val l = norm(it.loadLabel(pm).toString()); l.length >= 3 && wanted.contains(l) }
                  ?: return false
              val launch = pm.getLaunchIntentForPackage(hit.activityInfo.packageName) ?: return false
              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              ctx.startActivity(launch)
              return true
          }

          private fun askGemini(apiKey: String, userText: String, onResult: (String) -> Unit) {
              thread {
                  val out = try {
                      val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$MODEL:generateContent?key=$apiKey")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.connectTimeout = 15000
                      conn.readTimeout = 30000
                      conn.doOutput = true
                      val sys = "Eres Jarvis, un asistente por voz. Responde siempre en español, en 1 a 3 frases breves, listas para leerse en voz alta."
                      val body = JSONObject()
                          .put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", sys))))
                          .put("contents", JSONArray().put(JSONObject().put("role", "user")
                              .put("parts", JSONArray().put(JSONObject().put("text", userText)))))
                      conn.outputStream.use { it.write(body.toString().toByteArray()) }
                      val code = conn.responseCode
                      val raw = (if (code in 200..299) conn.inputStream else conn.errorStream).bufferedReader().use { it.readText() }
                      if (code in 200..299) {
                          JSONObject(raw).getJSONArray("candidates").getJSONObject(0).getJSONObject("content")
                              .getJSONArray("parts").getJSONObject(0).getString("text").trim()
                      } else {
                          val msg = runCatching { JSONObject(raw).getJSONObject("error").getString("message") }.getOrDefault("error $code")
                          "Gemini respondió con un error: $msg"
                      }
                  } catch (e: Exception) {
                      "No pude conectar con Gemini: ${e.message ?: "error de red"}"
                  }
                  onResult(out)
              }
          }

          class MainActivity : AppCompatActivity() {
              private lateinit var keyInput: EditText
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  fun dp(v: Int) = (v * d).toInt()
                  val prefs = getSharedPreferences("jarvis", MODE_PRIVATE)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(24), dp(48), dp(24), dp(24))
                  fun add(v: View, top: Int) {
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.topMargin = dp(top)
                      root.addView(v, lp)
                  }
                  fun label(t: String, size: Float, color: Int, a: Float): TextView {
                      val tv = TextView(this)
                      tv.text = t
                      tv.textSize = size
                      tv.setTextColor(color)
                      tv.alpha = a
                      return tv
                  }
                  add(label("JARVIS", 26f, ACCENT, 1f), 0)
                  add(label("Burbuja flotante con voz", 13f, TEXTC, 0.7f), 4)
                  add(label("Clave de API de Gemini", 12f, TEXTC, 1f), 28)
                  keyInput = EditText(this)
                  keyInput.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  keyInput.hint = "AIza..."
                  keyInput.setTextColor(TEXTC)
                  keyInput.setHintTextColor(Color.GRAY)
                  keyInput.setBackgroundColor(SURFACE)
                  keyInput.setPadding(dp(12), dp(12), dp(12), dp(12))
                  keyInput.setText(prefs.getString("gemini_key", ""))
                  add(keyInput, 6)
                  status = label("", 12f, TEXTC, 0.8f)
                  add(status, 20)
                  val start = Button(this)
                  start.text = "Activar burbuja flotante"
                  start.setOnClickListener { checkAndStart(prefs) }
                  add(start, 16)
                  val stop = Button(this)
                  stop.text = "Detener burbuja"
                  stop.setOnClickListener {
                      stopService(Intent(this, OverlayService::class.java))
                      status.text = "Burbuja detenida."
                  }
                  add(stop, 8)
                  add(label("Al activar, Android te pide 'Mostrar sobre otras apps' y el micrófono: aceptá los dos. Después tocá la burbuja para hablarle desde cualquier app, y arrastrala para moverla. Para abrir una app decí, por ejemplo: 'abrí WhatsApp'.", 11.5f, TEXTC, 0.55f), 24)
                  val scroll = ScrollView(this)
                  scroll.setBackgroundColor(BG)
                  scroll.addView(root)
                  setContentView(scroll)
                  updateStatus()
              }

              private fun updateStatus() {
                  val overlay = Settings.canDrawOverlays(this)
                  val mic = ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  status.text = "Superposición: ${if (overlay) "OK" else "falta"} · Micrófono: ${if (mic) "OK" else "falta"}"
              }

              private fun checkAndStart(prefs: SharedPreferences) {
                  prefs.edit().putString("gemini_key", keyInput.text.toString().trim()).apply()
                  if (prefs.getString("gemini_key", "").isNullOrBlank()) {
                      Toast.makeText(this, "Primero pegá tu clave de Gemini", Toast.LENGTH_SHORT).show()
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Activá 'Mostrar sobre otras apps' para Jarvis, volvé y tocá de nuevo", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                      return
                  }
                  startForegroundService(Intent(this, OverlayService::class.java))
                  status.text = "Burbuja activa. Minimizá la app y buscala en la pantalla."
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  updateStatus()
                  if (grantResults.firstOrNull() == PackageManager.PERMISSION_GRANTED) {
                      checkAndStart(getSharedPreferences("jarvis", MODE_PRIVATE))
                  }
              }

              override fun onResume() {
                  super.onResume()
                  updateStatus()
              }
          }

          class OverlayService : Service(), TextToSpeech.OnInitListener {
              private lateinit var wm: WindowManager
              private lateinit var bubble: ImageView
              private lateinit var bubbleLp: WindowManager.LayoutParams
              private var reply: TextView? = null
              private var hideTask: Runnable? = null
              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var listening = false
              private val ui = Handler(Looper.getMainLooper())
              private val overlayType = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY

              override fun onCreate() {
                  super.onCreate()
                  val n = buildNotification()
                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  else startForeground(1, n)
                  tts = TextToSpeech(this, this)
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  bubble = ImageView(this)
                  bubble.setImageResource(android.R.drawable.ic_btn_speak_now)
                  bubble.setPadding(24, 24, 24, 24)
                  bubble.background = makeShape(SURFACE, ACCENT, true)
                  bubbleLp = WindowManager.LayoutParams(
                      150, 150, overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  )
                  bubbleLp.gravity = Gravity.TOP or Gravity.START
                  bubbleLp.x = 20
                  bubbleLp.y = 300
                  wm.addView(bubble, bubbleLp)
                  enableDrag()
              }

              private fun enableDrag() {
                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  var moved = false
                  bubble.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = bubbleLp.x; startY = bubbleLp.y
                              touchX = e.rawX; touchY = e.rawY
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - touchX).toInt()
                              val dy = (e.rawY - touchY).toInt()
                              if (abs(dx) > 12 || abs(dy) > 12) moved = true
                              bubbleLp.x = startX + dx
                              bubbleLp.y = startY + dy
                              wm.updateViewLayout(bubble, bubbleLp)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) onTapped()
                              true
                          }
                          else -> false
                      }
                  }
              }

              private fun onTapped() {
                  if (listening) return
                  val key = getSharedPreferences("jarvis", MODE_PRIVATE).getString("gemini_key", "") ?: ""
                  if (key.isBlank()) {
                      showReply("Abrí la app de Jarvis y guardá tu clave de Gemini.")
                      return
                  }
                  startListening()
              }

              private fun startListening() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      showReply("Este teléfono no tiene reconocimiento de voz disponible.")
                      return
                  }
                  listening = true
                  bubble.background = makeShape(SURFACE, WARN, true)
                  showReply("Te escucho…")
                  recognizer?.destroy()
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer?.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(results: Bundle) {
                          val text = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          stopListening()
                          if (!text.isNullOrBlank()) handle(text)
                      }
                      override fun onError(error: Int) {
                          stopListening()
                          showReply("No te escuché bien, probá de nuevo.")
                      }
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "es-ES")
                  recognizer?.startListening(intent)
              }

              private fun stopListening() {
                  listening = false
                  bubble.background = makeShape(SURFACE, ACCENT, true)
              }

              private fun handle(text: String) {
                  val t = text.trim().lowercase(Locale.getDefault())
                  val prefix = listOf("abrí ", "abri ", "abre ", "abrir ", "abra ").firstOrNull { t.startsWith(it) }
                  if (prefix != null) {
                      val name = t.removePrefix(prefix).trim()
                      val msg = if (openApp(this, name)) "Abriendo $name." else "No encontré una app llamada $name."
                      showReply(msg)
                      speak(msg)
                      return
                  }
                  val key = getSharedPreferences("jarvis", MODE_PRIVATE).getString("gemini_key", "") ?: ""
                  showReply("Pensando…")
                  askGemini(key, text) { answer ->
                      ui.post {
                          showReply(answer)
                          speak(answer)
                      }
                  }
              }

              private fun speak(t: String) {
                  tts?.speak(t, TextToSpeech.QUEUE_FLUSH, null, "jarvis")
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) tts?.language = Locale("es", "ES")
              }

              private fun showReply(text: String) {
                  hideTask?.let { ui.removeCallbacks(it) }
                  reply?.let { runCatching { wm.removeView(it) } }
                  val tv = TextView(this)
                  tv.text = text
                  tv.textSize = 13f
                  tv.setTextColor(TEXTC)
                  tv.maxWidth = 560
                  tv.setPadding(36, 24, 36, 24)
                  tv.background = makeShape(SURFACE, ACCENT, false, 36f)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = bubbleLp.x
                  lp.y = (bubbleLp.y - 190).coerceAtLeast(60)
                  wm.addView(tv, lp)
                  reply = tv
                  val task = Runnable {
                      runCatching { wm.removeView(tv) }
                      if (reply === tv) reply = null
                  }
                  hideTask = task
                  ui.postDelayed(task, 7000)
              }

              private fun buildNotification(): Notification {
                  val channelId = "jarvis_overlay"
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel(channelId, "Jarvis activo", NotificationManager.IMPORTANCE_MIN))
                  return NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Jarvis está activo")
                      .setContentText("Tocá la burbuja para hablarle")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .build()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  hideTask?.let { ui.removeCallbacks(it) }
                  runCatching { wm.removeView(bubble) }
                  reply?.let { runCatching { wm.removeView(it) } }
                  recognizer?.destroy()
                  tts?.shutdown()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Compilar APK
        working-directory: proj
        run: gradle assembleDebug -Pandroid.useAndroidX=true -Dorg.gradle.jvmargs=-Xmx2g

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" proj/app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --title "Jarvis v${{ github.run_number }}" --notes "APK de Jarvis listo para instalar"
